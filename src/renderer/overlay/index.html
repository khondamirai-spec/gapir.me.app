<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>gapir me</title>
    <style>
      /* =========================================================================
         The floating pill.

         Dark, small and unbothered — it sits over somebody's actual work all day,
         so at rest it is a mark you can ignore, and it only becomes a piece of UI
         while a dictation is happening. The window never resizes (see
         src/main/overlay.ts for why); everything below is the pill growing inside
         a fixed, click-through window.

         The shape language is deliberately borrowed from Wispr Flow, measured off
         a screen recording of it frame by frame: a hairline capsule at rest, a
         black capsule of live bars while you speak, a narrow one holding just a
         spinner while the model works, then a fast collapse back to the hairline.

         The thinking state used to keep the eleven bars, flattened into a dim row
         of dots beside the spinner, so that "it stopped listening" was legible
         without a word of text. It reads as clutter at this size — eleven dots and
         a spinner both saying "wait" — so the bars now leave with the microphone
         and the spinner carries that state alone. The meter itself is untouched:
         while the hotkey is held it is the only proof the mic hears you.

         What must survive a tidy-up: every state is a fixed width and height on
         #pill, so the capsule morphs. `width: auto` cannot be transitioned, and a
         pill that jumps between sizes reads as a glitch rather than as a thing
         that moved.

         There is no caption on the recording or thinking states, on purpose. At
         90px wide there is no room for one, and the reference proves it does not
         need one — the only text left is an error, which is the one message the
         picture genuinely cannot carry.
         ========================================================================= */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      /* ---- Palette ----
         This is the one surface in the app that is dark by necessity rather than
         by taste: the pill sits on top of somebody else's window, and cream here
         would vanish into every white document it lands on. So the pill is the
         brand's dark mode, and dark mode swaps the two colors' roles — cream
         becomes the ink, and the burgundy survives only as the near-black it is
         drawn on.

         Nothing here is #000 or #fff. Both are off-brand, and at this size both
         read distinctly colder than the rest of the app; --ink-900 is as solid
         as black against a bright document while still being made of the same
         two colors as everything else. The translucent states are written as
         rgba() literals of these same values, because a var() cannot carry an
         alpha into rgba(). */
      :root {
        --cream: #ffeee0;
        --ink-900: #3a0116;
        /* The brand's functional green and red (#3F6B4F, #A8321E) are picked for
           cream backgrounds and sink into the pill. Each is lifted toward cream
           by roughly the amount the text ramp is in dark mode: the same colour
           at its dark-mode step, not a new one. */
        --ok: #6fa37e;
        --err: #e0705a;
        /* The same faces as the app window; see src/renderer/fonts/fonts.css. Onest stays
           in the stack as the Cyrillic fallback — Figtree has no Cyrillic glyphs. */
        --font-ui: 'Figtree', 'Onest', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      /*
       * A transparent pad around the pill, and the size hover is measured against. The
       * resting pill is a 46×10 sliver — a target that small is one a user misses, and
       * missing it means never discovering the hotkey the hint exists to name.
       *
       * The measuring is done in main, not here: the window is click-through and Chromium
       * never sees the cursor, so `hitRect()` in src/main/overlay.ts mirrors every number in
       * this rule and the two dock rules below it. Change one and change the other.
       *
       * ---- Why `position: absolute` rather than flex alignment on the body ----
       *
       * The dock is applied on a drop, at the same moment main starts gliding the window to
       * its new home (see glideTo in src/main/overlay.ts), so the pill has to *travel* to
       * its new anchor rather than appear at it — a 130px sideways jump plus a quarter turn
       * in one frame reads as a glitch. `justify-content` and `align-items` cannot be
       * transitioned; `left`, `bottom` and `transform` all interpolate, which is the whole
       * reason the anchoring is written this way — and it is why the right dock is
       * `left: calc(100% - …)` rather than the `right` it obviously wants to be: `left` and
       * `right` do not interpolate into each other.
       *
       * The offsets:
       *   bottom 24px  — PAD_BOTTOM. Room for the pill's own shadow, which is `0 8px 32px`
       *                  and so reaches offset + blur/2 = 24px below it. Anchored flush to
       *                  the window's edge, that shadow was sliced off in a hard horizontal
       *                  line — glow above the pill, an abrupt cut below. Main gives the
       *                  window the pixels back by sitting flush with the work area
       *                  (BOTTOM_GAP is 0), so the pill still floats just above the taskbar.
       *   left 8px     — PAD_SIDE on a side dock. Deliberately half of PAD_BOTTOM rather
       *                  than equal to it: the shadow those pixels buy room for is cast
       *                  downward (`0 8px 32px`), so a pill lying against a *side* edge
       *                  needs far less of it — and at the 16px this used to be, the pill
       *                  read as resting near the edge rather than fixed to it.
       *
       * `transform-origin` is the bottom edge rather than the centre, and that is what makes
       * the side docks work at all: the pill grows *upward* from its anchored bottom edge in
       * every state (46×10 at rest, 64×30 hovered, 90×32 speaking), so rotating about that
       * same edge turns "grows upward from PAD_BOTTOM" into "grows inward from PAD_SIDE"
       * without a single number changing. Rotating about the centre instead would make the
       * pill step toward and away from the edge every time it changed size. It costs the
       * bottom dock nothing: a pure translate is the same transform whatever its origin.
       */
      #hit {
        position: absolute;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-width: 64px;
        min-height: 30px;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 0);
        transform-origin: 50% 100%;
        transition:
          left 260ms cubic-bezier(0.22, 1, 0.36, 1),
          bottom 260ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* ---- The side docks ----
         Main sends the dock over IPC (see setDock in src/main/overlay.ts) and snaps the
         window to the edge; these turn the pill to face it.

         A left or right edge runs top to bottom, and a wide capsule stuck to one sticks OUT
         of it — the pill reads as something that fell against the screen edge rather than
         something that lives there. So a side-docked pill is laid out exactly as it always
         is and then rotated a quarter turn. Left turns clockwise and right anticlockwise:
         the pill grows upward in its own frame, and those are the two signs that turn
         "upward" into "inward, away from the docked edge" rather than off the screen.

         The hint does NOT turn with it — words are horizontal in every dock — which is why
         it is anchored to the window rather than to this box. See the #tooltip rules.

         The anchor itself needs nothing new: `transform-origin` above is already the pill's
         bottom edge, so the rotation turns the whole layout a quarter turn about it and the
         pill's bottom face — the one PAD_BOTTOM holds off the taskbar — becomes the face
         held PAD_SIDE off the screen edge. `left` therefore reads 8px here in exactly the
         sense it reads 24px in `bottom` above.

         `bottom: 50%` rather than a fixed offset because a side dock is the taller window
         (SIDE_HEIGHT) and main clamps it on a short work area: the pill belongs on the
         window's own middle, which is the line the dock guide draws. */
      body.dock-left #hit,
      body.dock-right #hit {
        bottom: 50%;
      }

      body.dock-left #hit {
        left: 8px;
        transform: translate(-50%, 0) rotate(90deg);
      }

      body.dock-right #hit {
        left: calc(100% - 8px);
        transform: translate(-50%, 0) rotate(-90deg);
      }

      /* The one state that refuses to turn. An error is a sentence over up to three lines,
         and a sentence read sideways is not read at all — so the error pill drops the
         rotation and sits square in the middle of its window, which is why a side-docked
         window keeps the full WIDTH it does not otherwise need. hitRect() in
         src/main/overlay.ts has the matching special case. */
      body.dock-left #hit:has(#pill.error),
      body.dock-right #hit:has(#pill.error),
      body.dock-left #hit:has(#pill.prompt),
      body.dock-right #hit:has(#pill.prompt) {
        left: 50%;
        transform: translate(-50%, 50%);
      }

      /* ---- At rest ----
         A hairline capsule and nothing else: no glyph, no fill worth the name. It is the
         smallest thing that still says "the app is here" — 46×10 over someone's document
         is furniture, and anything larger is an interruption they did not ask for.

         The transition declared here is the one that runs on the way BACK to rest, because
         a transition is read off the state being transitioned *to*. That is why the collapse
         curve lives on the base rule and the expansion curve on .active: the reference
         collapses with a small undershoot — 39×7 before settling at 40×8 — and springs the
         last pixel back, which is what the overshooting cubic-bezier below reproduces. */
      #pill {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 10px;
        border-radius: 999px;
        /* The pill is clickable (main switches mouse events on while the cursor is on it —
           see setHovered in src/main/overlay.ts), and the cursor is the only affordance
           there is room for. */
        cursor: pointer;
        /* The states morph by size; clipping keeps the contents (the logo, a partial
           transcript) inside a capsule that is still mid-growth rather than poking out of
           it. The hover tooltip lives OUTSIDE the pill for exactly this reason — see the
           #tooltip rules below. */
        overflow: hidden;
        background: rgba(58, 1, 22, 0.5);
        border: 1px solid rgba(255, 238, 224, 0.4);
        /* The brand allows exactly one shadow and reserves it for this window.
           Its geometry is used verbatim; only the alpha is raised, because the
           published 0.08 is tuned for cream and this lands on whatever the user
           happens to have open. */
        box-shadow: 0 8px 32px rgba(89, 2, 34, 0.28);
        color: var(--cream);
        opacity: 0.82;
        transition:
          width 230ms cubic-bezier(0.34, 1.4, 0.64, 1),
          height 230ms cubic-bezier(0.34, 1.4, 0.64, 1),
          padding 230ms cubic-bezier(0.34, 1.4, 0.64, 1),
          gap 230ms cubic-bezier(0.34, 1.4, 0.64, 1),
          opacity 140ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      /* Very slowly, very slightly, the resting bar breathes. It is the only thing on screen
         that says the app is alive rather than merely drawn — the reference has nothing of
         the kind, but the reference is not something you install and then wonder about. */
      #pill:not(.active):not(.error):not(.done):not(.prompt):not(.hover) {
        animation: breathe 4.2s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.62;
        }
        50% {
          opacity: 0.92;
        }
      }

      /* ---- Hover ----
         The resting mark is deliberately anonymous, which leaves nowhere to find out what
         it wants from you. Pointing at it is the one moment a user has actually asked, so
         hover is where everything gets named — the Wispr Flow pattern, not the inline
         caption this used to be: the sliver becomes a small capsule wearing the mark, and a
         tooltip pill floats above it naming the hotkey. Only at rest: during a dictation the
         pill is already saying something more useful, and moving the cursor over it must not
         change what it says.

         There used to be a second circle beside the pill — a cursor glyph whose own hover
         swapped the tooltip for a longer how-to naming the click and the drag. Two floating
         objects for one resting mark is one too many, and the arrow read as a stray cursor
         stuck to the screen, so it went; the how-to briefly survived as a second line here
         and went the same way, because the hotkey is the one thing worth saying to somebody
         who has only pointed at a 46px bar. The click and the drag are discovered by trying
         them, and the app window's Yordam pane is where they are written down. Don't add
         either back.

         The tooltip is absolutely positioned above the pill rather than laid out beside it,
         so summoning it never shifts the pill itself — a mark that hops sideways when
         pointed at reads as flinching. */
      #pill.hover:not(.active):not(.error):not(.done):not(.prompt) {
        width: 64px;
        height: 30px;
        opacity: 1;
        background: rgba(58, 1, 22, 0.96);
        border-color: rgba(255, 238, 224, 0.14);
      }

      /* The tooltip pill: the hotkey, and nothing else.
         ---- Why it is a child of the body and not of #hit ----

         Because it is the one thing that must NOT turn with the pill. A side-docked #hit is
         rotated a quarter turn, and anything inside it inherits that — which made the hint
         read bottom-to-top up the screen edge, i.e. not read at all. A tooltip is words, and
         words are horizontal in every dock.

         Counter-rotating it inside #hit was the obvious fix and is the wrong one: its
         `left`/`bottom` would still resolve in the rotated frame, so the gap between pill
         and tooltip would be measured along the wrong axis and the offset that centres it
         would depend on the text's own width. Positioned against the window instead, each
         dock is three plain properties, and the anchoring is the same shape as the pill's
         own: near the docked edge, centred on the other axis.

         It cannot be `position: fixed` for the same reason it cannot stay inside #hit — a
         transformed ancestor becomes the containing block even for fixed children. Out of
         #hit is out of #hit. */
      #tooltip {
        position: absolute;
        display: none;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 12px;
        border-radius: 12px;
        background: rgba(58, 1, 22, 0.96);
        border: 1px solid rgba(255, 238, 224, 0.14);
        box-shadow: 0 8px 32px rgba(89, 2, 34, 0.28);
        font-size: 12px;
        letter-spacing: 0.1px;
        color: rgba(255, 238, 224, 0.7);
        white-space: nowrap;
        animation: tip-in 160ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      #tooltip b {
        font-weight: 600;
        color: var(--cream);
      }


      /* `:has()` rather than the sibling combinator this used to be — the tooltip is no
         longer next to the pill in the DOM, and the condition is still exactly "the pill is
         wearing its hover capsule". */
      body:has(#pill.hover:not(.active):not(.error):not(.done):not(.prompt)) #tooltip {
        display: block;
      }

      @keyframes tip-in {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(4px);
        }
      }

      /* Beside the pill at a side dock, and level with it: PAD_SIDE (8) + the hover
         capsule's 30px thickness + a 12px gap clears the pill exactly, and the window's
         vertical middle is the line the pill itself sits on. Still horizontal, because the
         window is what these resolve against now — see the note on #tooltip above.

         `left`/`right` do not interpolate into each other, which costs nothing here: the
         tooltip is hidden for the whole of a drag, so it never animates between docks. */
      body.dock-left #tooltip,
      body.dock-right #tooltip {
        bottom: auto;
        top: 50%;
      }

      body.dock-left #tooltip {
        left: 50px;
        transform: translateY(-50%);
        animation-name: tip-in-left;
      }

      body.dock-right #tooltip {
        left: auto;
        right: 50px;
        transform: translateY(-50%);
        animation-name: tip-in-right;
      }

      /* The entrance slides out of the pill rather than up off it, which is the same gesture
         seen through the same quarter turn. Each needs its own keyframes because the resting
         transform differs — inheriting the centred one would teleport the tooltip for a
         frame before settling. */
      @keyframes tip-in-left {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(-4px);
        }
      }

      @keyframes tip-in-right {
        from {
          opacity: 0;
          transform: translateY(-50%) translateX(4px);
        }
      }

      /* Mid-drag the pill is a thing being carried, not a menu: the caption gets out of the
         way until it lands. The class comes from overlay.ts, which is also what tells main
         to move the window. */
      body.dragging #tooltip {
        display: none !important;
      }

      /* Picked up, and it should feel picked up. The lift is the whole fix for "it feels
         heavy": the window is being moved under the cursor every frame, and a pill that is
         also still running its own size transitions reads as lagging behind its own shadow.
         So geometry is pinned for the duration and only the lift animates. */
      body.dragging #pill {
        cursor: grabbing;
        transform: scale(1.07);
        box-shadow: 0 14px 38px rgba(89, 2, 34, 0.5);
        transition:
          transform 140ms cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 140ms ease;
      }

      /* Pinned to the hover capsule while carried — but only when the pill is at rest.
         Dragging a recording pill has to leave the recording pill alone, which is what the
         :not() chain buys (and what the specificity of the .hover rule above demands). */
      body.dragging #pill:not(.active):not(.error):not(.done):not(.prompt) {
        width: 64px;
        height: 30px;
        opacity: 1;
        background: rgba(58, 1, 22, 0.96);
        border-color: rgba(255, 238, 224, 0.14);
      }

      /* ---- Speaking, and thinking ----
         Fully opaque and borderless: the capsule has to read as a solid object against a
         bright document as well as a dark one, and a translucent one picks up whatever is
         underneath it and turns muddy. The brand's deepest ink rather than #000 — at this
         value the difference is invisible against a document but keeps the pill made of
         the same two colors as the rest of the app, which matters where the two are seen
         together (the pill sits below the app window). */
      #pill.active {
        width: 90px;
        height: 32px;
        padding: 0 14px;
        gap: 10px;
        opacity: 1;
        background: var(--ink-900);
        border-color: transparent;
        box-shadow: 0 8px 32px rgba(89, 2, 34, 0.42);
        /* Outward: no spring. The pill is arriving under a hand that is still holding the
           hotkey down, and an overshoot there reads as a wobble rather than as speed. */
        transition:
          width 200ms cubic-bezier(0.22, 1, 0.36, 1),
          height 200ms cubic-bezier(0.22, 1, 0.36, 1),
          padding 200ms cubic-bezier(0.22, 1, 0.36, 1),
          gap 200ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 120ms ease,
          background-color 160ms ease,
          border-color 160ms ease;
      }

      /* The bars leave with the microphone, so this holds a 16px spinner and nothing else:
         44px is the same capsule the tick gets in .done, which makes "working" and "done"
         two frames of one shape rather than two different pills. (It was 122px while the
         dots stayed on through transcription.) */
      #pill.thinking {
        width: 44px;
        gap: 0;
      }

      /* A live partial transcript is the one thing worth spending width on, and only the
         Live API ever sends one (off by default), so it is a variant rather than the shape.
         Without this the text would be clipped by the 90px capsule with no sign it existed. */
      #pill.active.with-text {
        justify-content: flex-start;
        width: 300px;
        height: 42px;
      }

      #pill.done {
        width: 44px;
        height: 32px;
        gap: 0;
        opacity: 1;
        background: var(--ink-900);
        border-color: transparent;
      }

      #pill.error {
        /* Error text is a sentence over up to three lines, so it needs the extra height. */
        justify-content: flex-start;
        gap: 12px;
        width: 336px;
        height: 62px;
        padding: 0 17px;
        opacity: 1;
        background: rgba(58, 1, 22, 0.96);
        border-color: rgba(224, 112, 90, 0.45);
      }

      /* ---- The offer ----
         Not an error, and it must not look like one. "You are signed out" used to be a red
         sentence on the pill, which is a notification telling somebody to go and find a
         window with a button in it — so it became the button. Ink rather than the error's
         red border, one line, and a cursor that says it can be pressed.

         It shares the ERROR state with the real errors (see promptSignIn in
         src/main/state.ts), so these rules come *after* `#pill.error` and the renderer
         never sets both classes at once.

         `.prompt` is also named in the `:not()` chain of every resting-pill rule above, and
         that is not tidiness: those chains outrank a plain `#pill.prompt`, so without the
         exclusion, hovering would collapse this button into the 64px idle capsule at exactly
         the moment somebody was reaching to click it. */
      #pill.prompt {
        justify-content: center;
        gap: 10px;
        width: 232px;
        height: 44px;
        padding: 0 18px;
        opacity: 1;
        background: var(--ink-900);
        border-color: rgba(255, 238, 224, 0.18);
        box-shadow: 0 8px 32px rgba(89, 2, 34, 0.42);
        cursor: pointer;
      }

      /* Waiting for a browser somewhere else on the machine: same capsule, no button
         affordance, because there is nothing left to press. */
      #pill.prompt.waiting {
        width: 216px;
        cursor: default;
      }

      #pill.prompt #label {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* Google's mark, at Google's colours — the one place in this app where a brand other
         than ours is drawn, and their terms require it be drawn as theirs. */
      #gmark {
        display: none;
        flex-shrink: 0;
        width: 17px;
        height: 17px;
      }

      #pill.prompt:not(.waiting) #gmark {
        display: block;
      }

      /* ---- The mark ----
         The gapir.me lips, painted via -webkit-mask-image from the real artwork (see the
         #logo rule below): the artwork is burgundy and the pill is near-black, so masking
         keeps the shape and lets the colour follow the state. It is only ever shown beside
         words — the hover hint and an error — since the resting bar and the waveform say
         what they are without it.

         Lips only, no waveform: below roughly 32px the bars close up into a filled mouth and
         the mark reads as a smudge, so the tray (16px), this pill (17px) and the app
         window's sidebar (22px) all drop them. Only the download page, at 44px, and
         resources/icon.png, at 256, draw the whole thing. See scripts/make-icons.mjs. */
      /* 20px, where the microphone this replaced was 17: the mark is about 2:1, so a square
         box that size renders it only ~10px tall and it reads as an afterthought beside the
         hint text. Width is what carries the weight here, not the box. */
      /* 40x20 rather than a 20px square: the mark is about 2:1, and squeezing it into a
         square either shrinks it to nothing or distorts it. */
      #logo {
        display: none;
        flex-shrink: 0;
        width: 40px;
        height: 20px;
        background: var(--cream);
        -webkit-mask-image: url('../assets/logo.png');
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
      }

      #pill.hover:not(.active):not(.error):not(.done):not(.prompt) #logo,
      #pill.error #logo {
        display: block;
      }

      #pill.error #logo {
        background: var(--err);
      }

      /* ---- Level meter, and the dots it becomes ----
         Eleven bars at 3px wide on a 5px pitch: the reference's proportions (a bar block
         a little over half the capsule's width) rather than its literal pixels, which came
         off a denser display. */
      #bars {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 24px;
        flex-shrink: 0;
      }

      .bar {
        width: 3px;
        height: 3px;
        border-radius: 2px;
        background: var(--cream);
        transition:
          height 70ms linear,
          background-color 160ms ease;
      }

      /* ---- Spinner, shown while transcribing ----
         Twelve spokes stepping round once every 1.05s, not a smoothly sweeping arc: the
         step is what makes it read as "working" at 16px, where a continuous rotation of
         something this small just shimmers. Spokes are built in overlay.ts. */
      #spinner {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: var(--cream);
        animation: spin 1.05s steps(12) infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---- Success tick ---- */
      #check {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        color: var(--ok);
        animation: pop 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes pop {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
      }

      #label {
        min-width: 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* An empty label is still a flex item, and a flex item still gets the gap on both
         sides of it — which is how a 10px gap between the dots and the spinner silently
         becomes 20px in the state that has no text. */
      #label:empty {
        display: none;
      }

      /* Error messages are sentences, not statuses — let them wrap instead of clipping. */
      #pill.error #label {
        white-space: normal;
        line-height: 1.32;
        font-size: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .hidden {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        #pill,
        #check {
          animation: none !important;
        }
        /* The spinner still has to turn — it is the only thing telling the user the app has
           not hung — but a 12-step tick is far calmer than a sweep. */
        #pill,
        .bar {
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="hit">
      <div id="pill">
        <!-- The real artwork, painted in the pill's cream by using it as a mask rather than
             as an image: the file is burgundy on transparent, which on this near-black
             capsule would be a hole. Masking keeps the mark's exact shape and lets the
             colour follow the state — cream normally, red when a dictation failed. -->
        <span id="logo" aria-hidden="true"></span>
        <!-- Order matters: dots, then the partial transcript if there is one, then the
             spinner — so the spinner stays at the right-hand end in every variant. -->
        <!-- Hidden until a dictation says otherwise. The meter belongs to RECORDING alone,
             and overlay.ts hides it in every other state — but the very first frame is drawn
             before any status has arrived, and a row of eleven dots clipped inside the
             resting hairline (or crowding the mark on hover) is what that frame looked
             like. The resting pill has no meter, so neither does the markup. -->
        <div id="bars" class="hidden"></div>
        <svg id="gmark" viewBox="0 0 48 48" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"
          />
          <path
            fill="#34A853"
            d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"
          />
          <path
            fill="#FBBC05"
            d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"
          />
          <path
            fill="#EA4335"
            d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"
          />
        </svg>
        <div id="label"></div>
        <svg id="spinner" class="hidden" viewBox="0 0 16 16" aria-hidden="true"></svg>
        <svg id="check" class="hidden" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path
            d="M3 8.5l3.2 3.2L13 5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <!-- Outside #hit, not inside it: #hit is rotated at a side dock and the hint has to stay
         horizontal, so it is anchored to the window instead. See the #tooltip rules. -->
    <!-- The chord is filled in by the renderer from the user's own setting; the default
         here is only what is drawn in the frame before main's first push arrives. -->
    <div id="tooltip">Gapiring <b id="tipKeys">Ctrl + Shift</b></div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
