<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Whisper UZ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * Bottom-anchored: the window's bottom edge sits a fixed gap above the taskbar, so
       * anchoring the pill there too means the idle logo keeps that exact gap and the pill
       * grows upward, away from the taskbar, as it expands.
       */
      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      /*
       * The window never resizes — this element is the whole animation. Widths are fixed
       * per state rather than content-derived because `width: auto` cannot be transitioned.
       */
      #pill {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 28px;
        padding: 0;
        border-radius: 16px;
        background: rgba(18, 18, 22, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
        color: #f4f4f5;
        /* Resting state: present enough to prove the app is running, dim enough to forget. */
        opacity: 0.38;
        transition:
          width 240ms cubic-bezier(0.22, 1, 0.36, 1),
          height 240ms cubic-bezier(0.22, 1, 0.36, 1),
          padding 240ms cubic-bezier(0.22, 1, 0.36, 1),
          border-radius 240ms ease,
          opacity 180ms ease,
          background-color 180ms ease;
      }

      #pill.active,
      #pill.error {
        justify-content: flex-start;
        gap: 12px;
        width: 340px;
        padding: 0 16px;
        opacity: 1;
      }

      #pill.active {
        height: 56px;
        border-radius: 28px;
      }

      #pill.done {
        gap: 8px;
        width: 84px;
        height: 34px;
        border-radius: 17px;
        opacity: 1;
      }

      #pill.error {
        /* Error text is a sentence over up to three lines, so it needs the extra height. */
        height: 64px;
        border-radius: 20px;
        background: rgba(52, 16, 18, 0.95);
        border-color: rgba(248, 113, 113, 0.35);
      }

      /* ---- The mark ----
         Same microphone glyph scripts/make-icons.mjs draws for the tray and installer,
         inlined as SVG: the overlay's CSP is `default-src 'self'` and an inline element
         needs no asset load at all. */
      #logo {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        color: #8b7cf0;
        transition: color 180ms ease;
      }

      #pill.error #logo {
        color: #f87171;
      }

      /* Everything except the logo is hidden while collapsed. */
      #body {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1;
        opacity: 0;
        transition: opacity 140ms ease;
      }

      #pill:not(.active):not(.error):not(.done) #body {
        display: none;
      }

      #pill.active #body,
      #pill.error #body,
      #pill.done #body {
        opacity: 1;
      }

      /* ---- Level meter ---- */
      #bars {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 26px;
        flex-shrink: 0;
      }

      .bar {
        width: 3px;
        min-height: 3px;
        border-radius: 2px;
        background: #f87171;
        transition: height 70ms linear;
      }

      /* ---- Spinner, shown while transcribing ---- */
      #spinner {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---- Success tick ---- */
      #check {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: #4ade80;
      }

      #label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Error messages are sentences, not statuses — let them wrap instead of clipping. */
      #pill.error #label {
        white-space: normal;
        line-height: 1.3;
        font-size: 12px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }

      #label .hint {
        display: block;
        font-size: 11px;
        font-weight: 400;
        opacity: 0.55;
        margin-top: 1px;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="pill">
      <svg id="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="9.5" y="4.7" width="5" height="9.3" rx="2.5" fill="currentColor" />
        <path
          d="M7.2 11.5a4.8 4.8 0 0 0 9.6 0"
          stroke="currentColor"
          stroke-width="1.35"
          stroke-linecap="round"
        />
        <path d="M12 16.3v2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        <path d="M9.5 19h5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
      </svg>
      <div id="body">
        <div id="bars"></div>
        <div id="spinner" class="hidden"></div>
        <svg id="check" class="hidden" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path
            d="M3 8.5l3.2 3.2L13 5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <div id="label"></div>
      </div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
