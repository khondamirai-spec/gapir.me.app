# Supabase CLI project config. `project_id` is only a local label; the deployed project is
# chosen by `supabase link --project-ref <ref>`.
project_id = "gapir-me"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Must match the deployed project, or the PKCE redirect is rejected as an unknown site_url.
site_url = "gapirme://auth-callback"
# Both halves of the handoff.
#
# The https page is where the browser actually lands (src/app/auth/callback in the website
# repo): it tells the user they are signed in and hands the code to the app through the
# custom scheme. The scheme itself stays listed because it is also the site_url above, and
# because it is what an older installed build still asks for — an allowlist that dropped it
# would break sign-in for everyone who has not updated yet.
#
# The apex is listed alongside www because gapir.me answers with a 308 to www.gapir.me, and
# a build pointed at either must work. localhost is for `supabase start`.
additional_redirect_urls = [
  "gapirme://auth-callback",
  "https://www.gapir.me/auth/callback",
  "https://gapir.me/auth/callback",
  "http://localhost:54321"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.transcribe]
# Left on: Supabase verifies the caller's JWT before the function runs, so an unauthenticated
# request never reaches code that could spend the Gemini key.
verify_jwt = true

[functions.checkout]
# Creates an order for whoever is signed in, so it must know who that is.
verify_jwt = true

[functions.payme]
# Off, and it must be. Payme calls this endpoint from its own servers with HTTP Basic auth
# (`Paycom:<merchant_key>`) and knows nothing about Supabase JWTs — with verification on,
# every callback would be rejected and no payment would ever complete. The function
# authenticates the caller itself; see its own header comment.
verify_jwt = false
