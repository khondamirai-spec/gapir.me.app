# Reverse-DNS of gapir.me. It was `uz.whisperuz.app` until 2026-08-20, named after a program
# this one stopped being long ago — see `nsis.guid` at the bottom for what that rename cost
# and how it was paid.
appId: me.gapir.app
productName: gapir me
copyright: MIT

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# Both native dependencies ship prebuilt N-API binaries — uiohook-napi under prebuilds/,
# libnut under build/Release/ — and N-API is ABI-stable, so the Electron ABI they were built
# against doesn't matter. Left on, electron-builder hands them to node-gyp instead, which
# then demands a Visual Studio installation to rebuild binaries that were already correct.
npmRebuild: false

# Native modules must live outside the asar archive — .node files can't be loaded from it.
asarUnpack:
  - '**/node_modules/uiohook-napi/**'
  - '**/node_modules/@nut-tree-fork/**'

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray.png
    to: tray.png
  # ffmpeg is not optional in a packaged build: nobody who downloads an installer is going
  # to run `winget install ffmpeg` first. `npm run dist` fetches it via predist, so a build
  # that reaches this point always has it, and a missing file here should fail the build
  # rather than quietly produce an installer that can't record.
  - from: resources/ffmpeg.exe
    to: ffmpeg.exe
  - from: resources/ffmpeg-LICENSE.txt
    to: ffmpeg-LICENSE.txt

# The custom scheme the Google sign-in comes back on.
#
# Without this the installer registers no handler, the browser has nowhere to send the
# consent, and every sign-in on a packaged build silently does nothing — while working
# perfectly in dev, where src/main/index.ts registers the scheme at runtime against
# electron.exe. That gap is why this belongs in the build config and not only in code.
protocols:
  - name: gapir me
    schemes:
      - gapirme

# Owner and repo are inferred from the git remote, so this stays correct if the repo moves.
#
# `releaseType` is NOT optional here, whatever the default suggests. electron-builder
# publishes a *draft* release unless told otherwise, and a draft is invisible to everyone
# but us: `/releases/latest` skips it, the asset 404s, and electron-updater finds no
# latest.yml — while the workflow reports a green tick, because from its point of view the
# upload succeeded. That combination cost v0.2.1 through v0.2.3, and it is worth stating
# plainly: a release nobody can download is not a release, and nothing in CI will say so.
publish:
  - provider: github
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # An app that installs a keyboard hook and synthesises input trips heuristic AV detection.
  # Signing is what actually fixes this; add certificateFile when available.
  #
  # Until then this must stay false. electron-updater otherwise refuses an update whose
  # publisher signature doesn't match the running app's — a check an unsigned build can only
  # fail. Integrity still rests on the SHA-512 in latest.yml, fetched over TLS.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: gapir me
  # A fixed name, deliberately without the version: it makes
  # /releases/latest/download/gapir-me-Setup.exe a permanent link the download page can
  # hardcode. electron-updater reads the real filename out of latest.yml, so it doesn't care.
  artifactName: gapir-me-Setup.${ext}
  # **This is the installed identity, and it must not change.** electron-builder normally
  # derives it as a UUIDv5 of `appId`, which means renaming the appId silently renames the
  # app as far as Windows is concerned: the new installer would not recognise the existing
  # install, and everyone who already has gapir me would end up with two entries in Add/Remove
  # Programs and two Start Menu shortcuts after their next update.
  #
  # The value below is the GUID the shipped v0.2.4 installer already registered. Pinning it is
  # what lets the appId above be corrected without anyone noticing; it is an opaque identifier
  # now, and nothing reads the string it was once derived from.
  #
  # Verified rather than guessed, and reproducible — it is uuid5 of the *old* appId under
  # electron-builder's namespace, and it matches the uninstall key on a machine that has
  # v0.2.4 installed:
  #
  #   python -c "import uuid; print(uuid.uuid5(uuid.UUID('50e065bc-3134-11e6-9bab-38c9862bdaf3'), 'uz.whisperuz.app'))"
  #   -> e474cddf-64b1-5ea6-961c-655c5864acae
  #
  # (The new appId would derive ea5be9ac-7e82-5c12-a8f2-9bb2848d72cd, which is precisely the
  # second install this line exists to prevent.)
  guid: e474cddf-64b1-5ea6-961c-655c5864acae
